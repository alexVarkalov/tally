[project]
name = "tally"
version = "0.1.0"
description = "Telegram bot that tallies events per day into a Google Sheet, one worksheet per tracker"
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot[job-queue]>=22.0,<23",
    "gspread>=6.1,<7",
    "sqlalchemy",
    "psycopg",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
tally = "tally.__main__:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
